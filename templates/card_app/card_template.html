<div class="card h-100">
    {% if card.image %}
        <img src="{{ card.image.url }}" class="card-img-top" alt="{{ card.title }}">
    {% else %}
        <div class="bg-light card-img-top d-flex align-items-center justify-content-center">
            <span class="text-muted">No Image</span>
        </div>
    {% endif %}
    
    <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ card.title }}</h5>
        <p class="card-text flex-grow-1">{{ card.description|truncatewords:20 }}</p>
        <a href="{{ card.button_url|default:card.get_absolute_url }}" class="btn btn-primary mt-auto">{{ card.button_text }}</a>
    </div>
    
    <div class="card-footer text-muted">
        <small>Created: {{ card.created_at|date:"M d, Y" }}</small>
    </div>
</div>
